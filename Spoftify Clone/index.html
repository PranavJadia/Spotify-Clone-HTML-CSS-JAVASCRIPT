<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Webplayer:Music for Everyone!</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
    <link rel="shortcut icon" href="favicon.ico" />
</head>

<body>
    <!-- <img src="img/logo.svg"> -->
    <div class="container flex bg-black">
        <div class="left">
            <div class="close">
                <img class="invert" src="img/close.svg" alt="">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo"><img class="invert" src="img/logo.svg"></div>
                <ul>
                    <li><img class="invert" src="img/home.svg">Home</li>
                    <li><img class="invert" src="img/search.svg">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <div class="img"><img class="invert" src="img/playlist.svg"></div>
                    <h2>
                        Your Library
                    </h2>
                </div>
                <div class="songlist">
                    <ul>
                    </ul>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right border bg-grey m-2 rounded">
            <div class="header">
                <div class="nav">
                <div class="flex" style="gap: 5px;">
                    <img class="invert hamburger" src="img/hamburger.svg" alt="">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000"
                    fill="none">
                    <circle cx="12" cy="12" r="10" stroke=#ffffff stroke-width="1.5" />
                    <path d="M13.5 16C13.5 16 10.5 13.054 10.5 12C10.5 10.9459 13.5 8 13.5 8" stroke=#ffffff
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000"
                fill="none">
                <circle cx="12" cy="12" r="10" stroke=#ffffff stroke-width="1.5" />
                <path d="M10.5 8C10.5 8 13.5 10.946 13.5 12C13.5 13.0541 10.5 16 10.5 16" stroke=#ffffff
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
                </div>
                <div class="buttons">
                    <button class="signupbtn"">SignUp</button>
                    <button class="loginbtn">login</button>
                </div>
            </div>
            <div class="spotifyplaylist">
                <h2>Spotify Playlist</h2>
                <div class="cardcontainer">
                </div>
            </div>
            <div class="playbar">
                <div class="seekbar">
                    <div class="circle"></div>
                </div>
                <div class="songbar">

                    <div class="songinfo">
                        
                    </div>
                    <div class="songbuttons">
                        
                        <img id="prev" src="img/prevsong.svg" alt="">
                        <img id="play" src="img/play.svg">
                        <img id="next" src="img/nextsong.svg" alt="">
                    </div>
                    <div class="timevol">

                        <div class="songtime">
                            
                        </div>
                        <div class="volume">
                            <img src="img/volume.svg" alt="">
                            <div class="range">

                                <input type="range" name="volume">
                            </div>
                        </div>
                    </div>
            </div> 
            </div>
        </div>
    </div>
    <script src="js/script2.js"></script>
</body>

</html>
